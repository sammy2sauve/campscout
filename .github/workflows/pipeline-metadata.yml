name: Weekly National Metadata Sync

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run national metadata pipeline
        run: python -m src.flows.pipeline --national
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RECREATION_GOV_API_KEY: ${{ secrets.RECREATION_GOV_API_KEY }}
          NPS_API_KEY: ${{ secrets.NPS_API_KEY }}
          NOAA_USER_AGENT: ${{ secrets.NOAA_USER_AGENT }}
          PREFECT_API_URL: ""
