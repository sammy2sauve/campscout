name: Daily SE Availability Sync

# Runs every day at 5 AM UTC.
# Upserts rolling 90-day availability window for Southeast campgrounds,
# prunes past-date rows, and refreshes the materialized view.
# Campground metadata is NOT re-synced here — the weekly workflow handles that.

on:
  schedule:
    - cron: '0 5 * * *'   # Daily 05:00 UTC
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  run-pipeline:
    name: SE availability sync
    runs-on: ubuntu-latest
    timeout-minutes: 180    # availability polling is faster than full metadata

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily SE availability pipeline
        env:
          DATABASE_URL:            ${{ secrets.DATABASE_URL }}
          RECREATION_GOV_API_KEY:  ${{ secrets.RECREATION_GOV_API_KEY }}
          NPS_API_KEY:             ${{ secrets.NPS_API_KEY }}
          NOAA_USER_AGENT:         ${{ secrets.NOAA_USER_AGENT }}
          PREFECT_API_URL:         ''
        run: python -m src.flows.pipeline
