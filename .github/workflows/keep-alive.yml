name: Keep API Alive

on:
  schedule:
    - cron: '*/14 * * * *'   # every 14 minutes — Render sleeps after 15
  workflow_dispatch:          # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: |
          curl -sf "${{ secrets.RENDER_API_URL }}/api/regions" \
            -o /dev/null \
            --max-time 30 \
            && echo "OK" || echo "Server may be cold-starting, that's fine"
